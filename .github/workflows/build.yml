name: IrAutoX Sciter Windows Build
on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build Next.js and Tailwind UI
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Fetch Sciter x86 SDK
        shell: pwsh
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/c-smile/sciter-sdk.git sciter-sdk
          git -C sciter-sdk sparse-checkout set include bin.win/x32
      - name: Configure Win32
        run: cmake -S . -B build -A Win32 -DSCITER_SDK_DIR="$env:GITHUB_WORKSPACE/sciter-sdk"
      - name: Build Sciter launcher
        run: cmake --build build --config Release --parallel
      - name: Compress executable with UPX
        shell: pwsh
        run: |
          choco install upx -y --no-progress
          upx --best --lzma build/Release/IrAutoX.exe
          upx -t build/Release/IrAutoX.exe
      - name: Package standalone launcher
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item build/Release/IrAutoX.exe package/
          Compress-Archive -Path package/* -DestinationPath IrAutoX-win32.zip -CompressionLevel Optimal -Force
      - uses: actions/upload-artifact@v4
        with:
          name: IrAutoX-win32
          path: IrAutoX-win32.zip
          if-no-files-found: error
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: IrAutoX-win32.zip
          generate_release_notes: true
