name: IrAutoX Windows Build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install WebView2 SDK
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.2903.40 -OutputDirectory packages -NonInteractive
          $sdk = Get-ChildItem packages -Directory -Filter 'Microsoft.Web.WebView2.*' | Select-Object -First 1
          "WEBVIEW2_ROOT=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Configure Win32
        run: cmake -S . -B build -A Win32 -DWEBVIEW2_ROOT="$env:WEBVIEW2_ROOT"
      - name: Build IrAutoX
        run: cmake --build build --config Release --parallel
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item build/Release/IrAutoX.exe package/
          Copy-Item -Recurse ui package/
          Copy-Item README.md package/
          Compress-Archive -Path package/* -DestinationPath IrAutoX-win32.zip -CompressionLevel Optimal -Force
      - uses: actions/upload-artifact@v4
        with:
          name: IrAutoX-win32
          path: IrAutoX-win32.zip
          if-no-files-found: error
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: IrAutoX-win32.zip
          generate_release_notes: true
