name: IrAutoX Native Windows Build
on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Win32
        run: cmake -S . -B build -A Win32
      - name: Build native launcher
        run: cmake --build build --config Release --parallel
      - name: Package native launcher
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item build/Release/IrAutoX.exe package/
          Copy-Item LA.gif package/
          Compress-Archive -Path package/* -DestinationPath IrAutoX-win32.zip -CompressionLevel Optimal -Force
      - uses: actions/upload-artifact@v4
        with:
          name: IrAutoX-win32
          path: IrAutoX-win32.zip
          if-no-files-found: error
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: IrAutoX-win32.zip
          generate_release_notes: true
