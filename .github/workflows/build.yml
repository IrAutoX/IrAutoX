name: IrAutoX Qt6 Standalone Windows Build
on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true
      - name: Configure Qt6 launcher
        run: cmake -S . -B build -A x64
      - name: Build Qt6 launcher
        run: cmake --build build --config Release --parallel 8
      - name: Deploy Qt runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force deploy | Out-Null
          Copy-Item build/Release/IrAutoXQt.exe deploy/
          windeployqt --release --no-translations --compiler-runtime --dir deploy deploy/IrAutoXQt.exe
      - name: Embed Qt runtime into standalone executable
        shell: pwsh
        run: |
          ./.github/scripts/embed-qt.ps1
          New-Item -ItemType Directory -Force package, build | Out-Null
          rc /nologo /fo build/embedded_resources.res launcher/embedded_resources.rc
          cl /nologo /std:c++17 /O1 /Os /MT /EHsc /DUNICODE /D_UNICODE launcher/bootstrap.cpp build/embedded_resources.res /link /SUBSYSTEM:WINDOWS /OPT:REF /OPT:ICF /OUT:package/IrAutoX.exe shell32.lib user32.lib
      - name: Compress standalone executable
        shell: pwsh
        run: |
          choco install upx -y --no-progress
          upx --best --lzma package/IrAutoX.exe
          upx -t package/IrAutoX.exe
          Compress-Archive -Path package/IrAutoX.exe -DestinationPath IrAutoX-win64.zip -CompressionLevel Optimal -Force
      - uses: actions/upload-artifact@v4
        with:
          name: IrAutoX-Qt6-win64-standalone
          path: IrAutoX-win64.zip
          if-no-files-found: error
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: IrAutoX-win64.zip
          generate_release_notes: true
